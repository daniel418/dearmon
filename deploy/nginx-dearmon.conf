# /etc/nginx/sites-available/dearmom.daniellin.tw
#
# 部署步驟(VPS 上):
#   sudo cp deploy/nginx-dearmon.conf /etc/nginx/sites-available/dearmom.daniellin.tw
#   sudo ln -s /etc/nginx/sites-available/dearmom.daniellin.tw /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# SSL 由 Cloudflare 處理(模式設 Flexible),這裡只開 80。

server {
    listen 80;
    listen [::]:80;
    server_name dearmom.daniellin.tw;

    root /var/www/dearmon;
    index index.html;

    # gzip 已壓的檔讓 nginx 直接送 .gz(若存在)
    gzip_static on;

    # 長期 cache 給 _next 的 hashed 靜態資源
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # public/ 下的圖片(背景圖)
    location /backgrounds/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 卡片上傳:client 用 PUT 方式存 PNG。檔名須符合 [A-Za-z0-9_-]{16,64}.png。
    # PUT 直接寫到 /var/www/dearmom-cards/ 對應檔。
    # 限定 PUT 方法、限定檔案大小、限定檔名格式,避免 abuse。
    location ~ "^/api/upload/([A-Za-z0-9_-]{16,64}\.png)$" {
        limit_except PUT { deny all; }
        client_max_body_size 8M;
        client_body_temp_path /tmp/dearmom-upload-tmp;
        dav_methods PUT;
        alias /var/www/dearmom-cards/$1;
    }

    # 卡片讀取:長期可被 cache,使用者長按可存到相簿
    location ~ "^/cards/([A-Za-z0-9_-]+\.png)$" {
        alias /var/www/dearmom-cards/$1;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Next.js static export:沒有對應 .html 的 fallback
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
