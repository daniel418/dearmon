# /etc/nginx/sites-available/dearmon.daniellin.tw
#
# 部署步驟:
#   sudo cp deploy/nginx-dearmon.conf /etc/nginx/sites-available/dearmon.daniellin.tw
#   sudo ln -s /etc/nginx/sites-available/dearmon.daniellin.tw /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# SSL 憑證(在執行下方 server 區塊之前):
#   sudo certbot --nginx -d dearmon.daniellin.tw
#   certbot 會自動把這個檔案改成附 SSL 的版本

server {
    listen 80;
    listen [::]:80;
    server_name dearmon.daniellin.tw;

    # certbot 拿憑證時會自動處理 ACME challenge
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js 需要的 WebSocket / 長連線
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
